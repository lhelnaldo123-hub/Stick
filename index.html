<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b141a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sticker Hub</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:560px;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b141a;color:#e9edef}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:#25d366;color:#04210f}
button.g{background:#2a3942;color:#e9edef}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Loading page */
#splash{position:fixed;inset:0;z-index:50;background:#0b141a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.logo{font-size:84px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(-6deg)}}
#splash h1{margin:0;font-size:28px;font-weight:800}
#splash p{margin:0;opacity:.7;font-size:14px}
.bar{width:180px;height:6px;border-radius:6px;background:#2a3942;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#25d366;border-radius:6px;animation:fill 1.8s ease-out forwards}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}

/* App */
header{position:sticky;top:0;z-index:5;background:#0b141a;padding:12px 12px 6px}
.top{display:flex;gap:8px}
#inst{border-radius:24px;white-space:nowrap}
#q{flex:1;min-width:0;padding:12px 14px;border:0;border-radius:24px;background:#202c33;color:#fff;font-size:16px}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips button{white-space:nowrap;padding:7px 12px;font-size:13px;background:#202c33;color:#e9edef;border-radius:18px}
.chips button.on{background:#25d366;color:#04210f}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px}
#grid button{padding:4px;background:#1f2c34;border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
#grid img{max-width:100%;max-height:100%;object-fit:contain}
#st{text-align:center;opacity:.75;font-size:14px;padding:10px}
#more{display:block;margin:8px auto 14px}
footer{text-align:center;font-size:12px;opacity:.55;padding:6px 0 20px}

/* Preview sheet */
#sheet,#maker{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
#sheet.on,#maker.on{display:flex}
#maker{z-index:30}
#mc{width:260px;height:260px;touch-action:none;border-radius:12px;background:repeating-conic-gradient(#2a3942 0 25%,#1f2c34 0 50%) 0 0/20px 20px}
.r2{display:flex;gap:8px;align-items:center;margin:10px 0;justify-content:center;flex-wrap:wrap;font-size:13px}
.r2 input[type=text]{flex:1;min-width:140px;padding:10px;border:0;border-radius:8px;background:#202c33;color:#fff;font-size:16px}
.r2 input[type=range]{flex:1}
#addbar{padding:8px 12px 0;text-align:center}
.tabs button{padding:10px 6px;font-size:13px}
select{padding:10px;border:0;border-radius:8px;background:#202c33;color:#fff;font-size:16px}
.panel{max-height:92vh;overflow:auto;width:100%;max-width:560px;margin:auto auto 0;background:#111b21;border-radius:20px 20px 0 0;padding:16px;text-align:center}
.panel img{width:220px;height:220px;object-fit:contain}
.panel .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#msg{min-height:18px;font-size:13px;opacity:.85;margin:8px 0 0}
.setup{padding:20px;line-height:1.5}
.setup code{background:#202c33;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>

<div id="splash">
  <div class="logo">😎</div>
  <h1>Sticker Hub</h1>
  <p>Loading stickers…</p>
  <div class="bar"><i></i></div>
</div>

<header>
  <div class="top"><input id="q" type="search" placeholder="Search stickers" enterkeyhint="search" autocomplete="off"><button id="inst" hidden>Install</button></div>
  <div class="tabs"><button id="tSt">Stickers</button><button id="tGif" class="g">GIFs &amp; memes</button></div>
  <div class="chips" id="chips"></div>
  <div class="tabs"><button id="tDisc">Discover</button><button id="tFav" class="g">Favourites</button><button id="tMine" class="g">My stickers</button></div>
</header>

<main>
  <div id="addbar" hidden><button id="addPhoto">+ Add photo</button><input type="file" id="pf" accept="image/*" hidden></div>
  <div id="grid"></div>
  <p id="st"></p>
  <button id="more" class="g" hidden>Load more</button>
</main>
<footer>Powered by GIPHY</footer>

<div id="maker">
  <div class="panel">
    <canvas id="mc" width="512" height="512"></canvas>
    <div class="r2"><label for="mm">Motion</label><select id="mm"><option value="none">Still (no motion)</option><option value="laugh">Laugh</option><option value="wiggle">Wiggle</option><option value="heart">Heartbeat</option><option value="bounce">Bounce</option><option value="spin">Spin</option><option value="zoom">Zoom</option><option value="shake">Shake</option><option value="float">Float</option></select></div>
    <div class="r2" id="mopts" hidden><label><input type="checkbox" id="me" checked> Emoji</label><label>Background <input type="color" id="mb" value="#ffffff"></label></div>
    <div class="r2"><label for="mz">Zoom</label><input type="range" id="mz" min="1" max="4" step="0.01" value="1"></div>
    <div class="r2"><input type="text" id="mn" placeholder="Name (e.g. Kofi laughing)" maxlength="40"><label><input type="checkbox" id="mr"> Rounded (still only)</label></div>
    <p style="font-size:12px;opacity:.7;margin:0">Drag the photo to position it.</p>
    <div class="r2"><button id="mSave">Save sticker</button><button id="mX" class="g">Cancel</button></div>
    <p id="mmsg"></p>
  </div>
</div>

<div id="sheet">
  <div class="panel">
    <img id="big" alt="Sticker preview">
    <div class="row">
      <button id="bShare">Send on WhatsApp</button>
      <button id="bFav" class="g">Add to favourites</button>
      <button id="bDl" class="g">Save to gallery</button>
      <button id="bDel" class="g" hidden>Delete</button>
      <button id="bX" class="g">Close</button>
    </div>
    <p id="msg"></p>
  </div>
</div>

<script>
/* 1. Get a free key at https://developers.giphy.com (Create an App, choose API) and paste it here */
const KEY='6iVcKr7J7CB6xOBRrlQJXgJNdGtwFXL5';

let type='stickers';
const base=()=>'https://api.giphy.com/v1/'+type+'/';
const rt=()=>type==='gifs'?'pg':'g';
const CATS=['Trending','Meme','Reaction','Funny','Love','Happy','Sad','Thank you','Hello','Birthday','Angry','Cat','Dance','Congrats'];
const $=id=>document.getElementById(id);
let q='',off=0,view='disc',shown=[],cur=null,timer;

/* Chips */
$('chips').innerHTML=CATS.map((c,i)=>`<button class="${i?'':'on'}" data-c="${c}">${c}</button>`).join('');
$('chips').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#chips button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  $('q').value='';
  q=b.dataset.c==='Trending'?'':b.dataset.c;
  setView('disc');load(true);
};
$('q').oninput=e=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{
    q=e.target.value.trim();
    document.querySelectorAll('#chips button').forEach(x=>x.classList.remove('on'));
    if(view==='mine'){showMine();return;}
    setView('disc');load(true);
  },450);
};

/* Type switch: stickers or GIFs and memes (includes real people) */
function setType(t){
  type=t;
  $('tSt').className=t==='stickers'?'':'g';
  $('tGif').className=t==='gifs'?'':'g';
  $('q').placeholder=t==='gifs'?'Search GIFs and memes':'Search stickers';
  setView('disc');load(true);
}
$('tSt').onclick=()=>setType('stickers');
$('tGif').onclick=()=>setType('gifs');

/* Tabs */
function setView(v){
  if((v==='mine')!==(view==='mine')){$('q').value='';q='';}
  view=v;
  $('tDisc').className=v==='disc'?'':'g';
  $('tFav').className=v==='fav'?'':'g';
  $('tMine').className=v==='mine'?'':'g';
  $('addbar').hidden=v!=='mine';
  $('q').placeholder=v==='mine'?'Search your stickers':type==='gifs'?'Search GIFs and memes':'Search stickers';
  if(v==='fav')showFavs();
  if(v==='mine')showMine();
}
$('tDisc').onclick=()=>{setView('disc');load(true);};
$('tFav').onclick=()=>setView('fav');
$('tMine').onclick=()=>setView('mine');

/* Data */
const favs=()=>{try{return JSON.parse(localStorage.getItem('favs')||'[]');}catch(e){return[];}};
const saveFavs=a=>{try{localStorage.setItem('favs',JSON.stringify(a));}catch(e){}};
const st=t=>$('st').textContent=t;

function map(d){
  const im=d.images;
  return{id:d.id,
    thumb:(im.fixed_width&&(im.fixed_width.webp||im.fixed_width.url))||im.original.url,
    full:(im.original&&(im.original.webp||im.original.url))||im.fixed_width.url,
    gif:(im.original&&im.original.url)||im.fixed_width.url};
}

async function load(reset){
  if(KEY.startsWith('PASTE')){
    $('grid').innerHTML='';
    $('st').innerHTML='<div class="setup">Add your free GIPHY key to the top of the code:<br><code>const KEY=\'your-key\'</code></div>';
    $('more').hidden=true;return;
  }
  if(reset){off=0;shown=[];$('grid').innerHTML='';}
  st('Loading…');$('more').hidden=true;
  const url=q
    ?`${base()}search?api_key=${KEY}&q=${encodeURIComponent(q)}&limit=24&offset=${off}&rating=${rt()}`
    :`${base()}trending?api_key=${KEY}&limit=24&offset=${off}&rating=${rt()}`;
  try{
    const r=await fetch(url);
    if(!r.ok)throw new Error(r.status);
    const j=await r.json(),list=j.data.map(map);
    if(view!=='disc')return;
    add(list);off+=list.length;
    st(shown.length?'':'No stickers found. Try another word.');
    $('more').hidden=list.length<24;
  }catch(e){
    st('Could not load stickers. Check your internet or your GIPHY key.');
  }
}
$('more').onclick=()=>load(false);

function add(list){
  const start=shown.length;shown=shown.concat(list);
  $('grid').insertAdjacentHTML('beforeend',list.map((s,i)=>`<button data-i="${start+i}" aria-label="Open sticker"><img src="${s.thumb}" loading="lazy" alt=""></button>`).join(''));
}
function showFavs(){
  shown=[];$('grid').innerHTML='';$('more').hidden=true;
  add(favs());
  st(shown.length?'':'No favourites yet. Open a sticker and tap Add to favourites.');
}
$('grid').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  cur=shown[+b.dataset.i];openSheet();
};

/* Preview sheet */
function isFav(){return favs().some(f=>f.id===cur.id);}
function openSheet(){
  $('big').src=cur.full;$('msg').textContent='';
  $('bFav').hidden=!!cur.own;$('bDel').hidden=!cur.own;
  if(!cur.own)$('bFav').textContent=isFav()?'Remove favourite':'Add to favourites';
  $('sheet').classList.add('on');
}
const close=()=>$('sheet').classList.remove('on');
$('bX').onclick=close;
$('sheet').onclick=e=>{if(e.target.id==='sheet')close();};
$('bFav').onclick=()=>{
  let a=favs();
  a=isFav()?a.filter(f=>f.id!==cur.id):[cur].concat(a);
  saveFavs(a);
  if(view==='fav'){showFavs();close();}else openSheet();
};

/* Share and download */
async function getFile(gif){
  const r=await fetch(gif&&cur.gif?cur.gif:cur.full),b=await r.blob();
  const x=b.type.includes('webp')?'webp':b.type.includes('png')?'png':'gif';
  return new File([b],'sticker.'+x,{type:b.type});
}
function save(f){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(f);a.download=f.name;a.click();
}
$('bShare').onclick=async()=>{
  $('msg').textContent='Getting sticker ready…';
  try{
    const f=await getFile();
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});$('msg').textContent='';}
    else{save(f);$('msg').textContent='Sharing is not supported here, so it was downloaded.';}
  }catch(e){$('msg').textContent=e.name==='AbortError'?'':'Could not share. Try Download.';}
};
$('bDl').onclick=async()=>{
  $('msg').textContent='Saving…';
  try{save(await getFile(true));$('msg').textContent='Saved as a GIF. Look in your Gallery or Files > Downloads.';}
  catch(e){$('msg').textContent='Download failed. Check your internet.';}
};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* My stickers: made from your own photos, stored on this phone */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('sh',1);r.onupgradeneeded=()=>r.result.createObjectStore('mine',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const tx=async(m,f)=>{const db=await DB;return new Promise((res,rej)=>{const t=db.transaction('mine',m),r=f(t.objectStore('mine'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);});};
let urls=[];
async function showMine(){
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  shown=[];$('grid').innerHTML='';$('more').hidden=true;
  let a=[];
  try{a=await tx('readonly',s=>s.getAll());}catch(e){st('Could not open storage on this browser.');return;}
  const f=q.toLowerCase();
  a=a.filter(o=>!f||o.name.toLowerCase().includes(f)).sort((x,y)=>y.ts-x.ts);
  if(view!=='mine')return;
  add(a.map(o=>{const u=URL.createObjectURL(o.blob);urls.push(u);return{id:o.id,thumb:u,full:u,gif:u,own:true};}));
  st(shown.length?'':(f?'No match. Try another name.':'No stickers yet. Tap Add photo to make your first one.'));
}
$('bDel').onclick=async()=>{
  if(!confirm('Delete this sticker?'))return;
  try{await tx('readwrite',s=>s.delete(cur.id));}catch(e){}
  close();showMine();
};

let mi=null,mx=0,my=0,md=null;
const mc=$('mc'),mctx=mc.getContext('2d');
$('addPhoto').onclick=()=>$('pf').click();
$('pf').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const im=new Image();
  im.onload=()=>{mi=im;mx=0;my=0;$('mz').value=1;$('mn').value='';$('mmsg').textContent='';$('maker').classList.add('on');$('mm').value='none';$('mopts').hidden=true;mstart();};
  im.src=URL.createObjectURL(f);
};
const nowT=()=>(performance.now()%1000)/1000;
function fx(m,t){
  const S=Math.sin,P=Math.PI;
  switch(m){
    case 'laugh':return{dy:-Math.abs(S(4*P*t))*22,r:S(8*P*t)*.06,s:1+.03*S(4*P*t),e:'😂'};
    case 'wiggle':return{r:S(2*P*t)*.15};
    case 'heart':return{s:1+.09*Math.pow(Math.max(0,S(4*P*t)),3),e:'❤️'};
    case 'bounce':return{dy:-Math.abs(S(2*P*t))*40};
    case 'spin':return{r:2*P*t};
    case 'zoom':return{s:1+.15*S(2*P*t)};
    case 'shake':return{dx:S(12*P*t)*14,e:'😡'};
    case 'float':return{dy:S(2*P*t)*20,dx:S(4*P*t)*8};
  }
  return{};
}
function mdraw(t){
  const m=$('mm').value,anim=m!=='none';
  if(t===undefined)t=anim?nowT():0;
  const f=Object.assign({dx:0,dy:0,r:0,s:1},fx(m,t));
  mctx.clearRect(0,0,512,512);
  if(anim){mctx.fillStyle=$('mb').value;mctx.fillRect(0,0,512,512);}
  const s=Math.max(512/mi.width,512/mi.height)*(+$('mz').value),w=mi.width*s,h=mi.height*s;
  mx=Math.max(Math.min(mx,(w-512)/2),-(w-512)/2);
  my=Math.max(Math.min(my,(h-512)/2),-(h-512)/2);
  mctx.save();
  if(!anim&&$('mr').checked){mctx.beginPath();if(mctx.roundRect)mctx.roundRect(0,0,512,512,90);else mctx.rect(0,0,512,512);mctx.clip();}
  mctx.translate(256+f.dx,256+f.dy);mctx.rotate(f.r);mctx.scale(f.s,f.s);
  mctx.drawImage(mi,-w/2+mx,-h/2+my,w,h);
  mctx.restore();
  if(anim&&f.e&&$('me').checked){
    mctx.save();
    mctx.font='110px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    mctx.textAlign='center';mctx.textBaseline='middle';
    mctx.translate(425,95);mctx.scale(1+.2*Math.sin(4*Math.PI*t),1+.2*Math.sin(4*Math.PI*t));
    mctx.fillText(f.e,0,0);
    mctx.restore();
  }
}
let raf=0;
function loop(){
  if(!mi||!$('maker').classList.contains('on')){raf=0;return;}
  mdraw();raf=requestAnimationFrame(loop);
}
function mstart(){
  cancelAnimationFrame(raf);mdraw();
  if($('mm').value!=='none')raf=requestAnimationFrame(loop);
}
mc.onpointerdown=e=>{md=[e.clientX,e.clientY];mc.setPointerCapture(e.pointerId);};
mc.onpointermove=e=>{
  if(!md||!mi)return;
  const k=512/mc.getBoundingClientRect().width;
  mx+=(e.clientX-md[0])*k;my+=(e.clientY-md[1])*k;md=[e.clientX,e.clientY];mdraw();
};
mc.onpointerup=mc.onpointercancel=()=>{md=null;};
$('mz').oninput=()=>mi&&mdraw();
$('mr').onchange=()=>mi&&mdraw();
$('mb').oninput=()=>mi&&mdraw();
$('me').onchange=()=>mi&&mdraw();
$('mm').onchange=()=>{$('mopts').hidden=$('mm').value==='none';mstart();};
$('mX').onclick=()=>{$('maker').classList.remove('on');mi=null;};
/* Tiny GIF maker: 252-colour palette, dithering, loops forever */
const PAL=(()=>{const a=[];for(let r=0;r<6;r++)for(let g=0;g<7;g++)for(let b=0;b<6;b++)a.push(Math.round(r*255/5),Math.round(g*255/6),Math.round(b*255/5));while(a.length<768)a.push(0);return a;})();
function quant(d,w,h){
  const px=new Uint8Array(w*h),er=new Float32Array(w*h*3);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,c=[0,1,2].map(k=>Math.max(0,Math.min(255,d[i*4+k]+er[i*3+k])));
    const ri=Math.round(c[0]*5/255),gi=Math.round(c[1]*6/255),bi=Math.round(c[2]*5/255);
    px[i]=ri*42+gi*6+bi;
    const e=[c[0]-ri*51,c[1]-gi*255/6,c[2]-bi*51];
    const sp=(xx,yy,f)=>{if(xx<0||xx>=w||yy>=h)return;const j=(yy*w+xx)*3;er[j]+=e[0]*f;er[j+1]+=e[1]*f;er[j+2]+=e[2]*f;};
    sp(x+1,y,7/16);sp(x-1,y+1,3/16);sp(x,y+1,5/16);sp(x+1,y+1,1/16);
  }
  return px;
}
function lzw(px){
  const res=[];let block=[],bits=0,nb=0,size=9,next=258,dict=new Map();
  const emit=c=>{bits|=c<<nb;nb+=size;while(nb>=8){block.push(bits&255);bits>>=8;nb-=8;if(block.length===255){res.push(255,...block);block=[];}}};
  const grow=()=>{if(next>(1<<size)-1&&size<12)size++;};
  emit(256);
  let cur=px[0];
  for(let i=1;i<px.length;i++){
    const c=px[i],key=(cur<<8)|c,v=dict.get(key);
    if(v!==undefined){cur=v;continue;}
    emit(cur);grow();
    if(next<4096)dict.set(key,next++);
    else{emit(256);dict.clear();next=258;size=9;}
    cur=c;
  }
  emit(cur);grow();emit(257);
  if(nb>0)block.push(bits&255);
  if(block.length)res.push(block.length,...block);
  res.push(0);
  return res;
}
function gifEncode(frames,w,h,delay){
  const o=[];
  for(const ch of 'GIF89a')o.push(ch.charCodeAt(0));
  o.push(w&255,w>>8,h&255,h>>8,0xF7,0,0);
  for(const v of PAL)o.push(v);
  o.push(0x21,0xFF,0x0B);for(const ch of 'NETSCAPE2.0')o.push(ch.charCodeAt(0));o.push(3,1,0,0,0);
  for(const px of frames){
    o.push(0x21,0xF9,4,0,delay&255,delay>>8,0,0);
    o.push(0x2C,0,0,0,0,w&255,w>>8,h&255,h>>8,0,8);
    for(const v of lzw(px))o.push(v);
  }
  o.push(0x3B);
  return new Uint8Array(o);
}
async function makeGif(){
  const W=320,N=12,t2=document.createElement('canvas');
  t2.width=t2.height=W;
  const c2=t2.getContext('2d',{willReadFrequently:true}),frames=[];
  for(let i=0;i<N;i++){
    mdraw(i/N);c2.drawImage(mc,0,0,W,W);
    frames.push(quant(c2.getImageData(0,0,W,W).data,W,W));
    await new Promise(r=>setTimeout(r));
  }
  return new Blob([gifEncode(frames,W,W,8)],{type:'image/gif'});
}
$('mSave').onclick=async()=>{
  $('mmsg').textContent=$('mm').value==='none'?'Saving…':'Making your animation…';
  try{
    let k=.92,b;
    if($('mm').value!=='none'){
      cancelAnimationFrame(raf);
      b=await makeGif();
    }else{
      mdraw(0);
      for(;;){
        b=await new Promise(r=>mc.toBlob(r,'image/webp',k));
        if(!b||b.type!=='image/webp'||b.size<=100000||k<=.3)break;
        k-=.1;
      }
    }
    await tx('readwrite',s=>s.put({id:'m'+Date.now(),name:$('mn').value.trim()||'My sticker',blob:b,ts:Date.now()}));
    $('maker').classList.remove('on');mi=null;
    setView('mine');
  }catch(e){$('mmsg').textContent='Could not save. Try again.';}
};

/* Install button */
let dp=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(!standalone&&ios)$('inst').hidden=false;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!standalone)$('inst').hidden=false;});
addEventListener('appinstalled',()=>{$('inst').hidden=true;dp=null;});
$('inst').onclick=async()=>{
  if(dp){dp.prompt();await dp.userChoice;dp=null;$('inst').hidden=true;}
  else if(ios)alert('On iPhone: tap the Share button, then Add to Home Screen.');
  else alert('Tap the ⋮ menu in your browser, then Install app or Add to Home screen.');
};

/* Loading page: stays at least 1.8s, then fades once the first stickers are in */
Promise.all([load(true),new Promise(r=>setTimeout(r,1800))]).then(()=>{
  $('splash').classList.add('out');
  setTimeout(()=>$('splash').remove(),600);
});
</script>
